<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4ec0ca" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="A mobile-friendly Flappy Bird game built with HTML5 Canvas and vanilla JavaScript." />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Score display (drawn in canvas, mirrored here for accessibility) -->
    <div id="score-display" aria-hidden="true">0</div>

    <!-- Overlay screens -->
    <div id="overlay">
      <div class="panel" id="start-panel">
        <h1>FLAPPY BIRD</h1>
        <p class="bird-icon">🐦</p>
        <p class="instruction">Tap / Click / Press Space to Flap</p>
        <button id="start-btn" type="button">▶ Play</button>
      </div>

      <div class="panel hidden" id="gameover-panel">
        <h2>GAME OVER</h2>
        <div class="stats">
          <div class="stat"><span>Score</span><strong id="final-score">0</strong></div>
          <div class="stat"><span>Best</span><strong id="best-score">0</strong></div>
        </div>
        <p id="new-best" class="hidden">🏆 New High Score!</p>
        <button id="restart-btn" type="button">↻ Restart</button>
      </div>
    </div>

    <div id="mute-btn" role="button" aria-label="Toggle sound">🔊</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
